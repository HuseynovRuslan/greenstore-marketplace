# Local development for developers who have Docker (run in backend/). The values match appsettings.Development.json
# and the tests' default GREENSTORE_TEST_DB. Development only: never use these passwords anywhere else.
#
#   docker compose up -d postgres           only the database (run the API with `dotnet run`, README.md §2)
#   docker compose up -d --build            database, migrations and the API on http://localhost:5080
#
# UNTESTED: the api and api-migrate services and the Dockerfile were written on a machine without a Docker daemon
# (docs/handoff/backend-status.md). The postgres service was checked with `docker compose config` only.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: greenstore
      POSTGRES_PASSWORD: greenstore_dev
      POSTGRES_DB: greenstore
      # UTF-8 with a Unicode-aware locale: pg_trgm must treat Cyrillic letters as word characters (DATABASE.md §2).
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
    ports:
      - "5432:5432"
    volumes:
      - greenstore-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenstore -d greenstore"]
      interval: 5s
      timeout: 5s
      retries: 20

  # The deploy step as a one-shot container: migrations, then the seed, then it exits (README.md §3).
  api-migrate:
    build: .
    image: greenstore-api
    command: ["migrate"]
    environment: &api-env
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=greenstore;Username=greenstore;Password=greenstore_dev
      Database__MigrateOnStartup: "false"
      # The browser-facing site address (CORS for photo uploads, the payment return page). Inside the container
      # localhost is the container itself, so the API's cache notices to the site do not arrive; pages still refresh
      # within 60 seconds.
      Frontend__BaseUrl: http://localhost:3000
      Media__BaseUrl: http://localhost:5080/media
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: greenstore-api
    environment: *api-env
    ports:
      - "5080:8080"
    volumes:
      - greenstore-media:/data/media
    depends_on:
      api-migrate:
        condition: service_completed_successfully

volumes:
  greenstore-postgres:
  greenstore-media:
