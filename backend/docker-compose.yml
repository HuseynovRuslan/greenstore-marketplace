# PostgreSQL 16 for local development, for developers who have Docker: `docker compose up -d` in backend/.
# The values match appsettings.Development.json and the tests' default GREENSTORE_TEST_DB. Development only.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: greenstore
      POSTGRES_PASSWORD: greenstore_dev
      POSTGRES_DB: greenstore
      # UTF-8 with a Unicode-aware locale: pg_trgm must treat Cyrillic letters as word characters (DATABASE.md §2).
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
    ports:
      - "5432:5432"
    volumes:
      - greenstore-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenstore -d greenstore"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  greenstore-postgres:
